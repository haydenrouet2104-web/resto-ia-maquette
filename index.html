<div class="device" id="device" data-format="phone">
  <div class="bezel"></div>
  <div class="notch"></div>
  <div class="glass" id="glass">

    <!-- écran d'accueil du téléphone -->
    <div class="home" id="home">
      <div class="hstatus">
        <span data-clock>19:41</span>
        <span class="r">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M2 8.6c5.4-4.2 14.6-4.2 20 0M5.2 12.2c3.7-2.9 9.9-2.9 13.6 0M8.6 15.8c2-1.5 4.8-1.5 6.8 0"/><circle cx="12" cy="19" r="1.1" fill="currentColor"/></svg>

        </span>
      </div>
      <div class="hgrid" id="hgrid"></div>
      <div class="hdots"><i class="on"></i><i></i><i></i></div>
      <div class="hdock" id="hdock"></div>
    </div>

    <!-- les applications s'insèrent ici -->

    <div class="toast" id="toast" role="status"></div>
    <button class="homebar" id="homebar" aria-label="Retour à l'écran d'accueil"><i></i></button>
  </div>
</div>
